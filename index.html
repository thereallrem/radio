<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Радио</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 35px 30px;
            width: 320px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .station-name {
            color: #e94560;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 25px;
            min-height: 22px;
        }
        .stations {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }
        button.station-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        button.station-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        button.station-btn.active {
            background: #e94560;
            font-weight: bold;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        #playBtn {
            background: #e94560;
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        #playBtn:hover {
            transform: scale(1.08);
        }
        input[type="range"] {
            width: 100%;
            accent-color: #e94560;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="player-card">
    <h1>WEB RADIO</h1>
    <div class="station-name" id="currentStation">Выберите волну</div>

    <div class="stations">
        <button class="station-btn" onclick="playStation('Lofi Hip Hop', 'https://ilovemusic.de', this)">🎧 Lofi Hip Hop</button>
        <button class="station-btn" onclick="playStation('Synthwave / Retrowave', 'https://nightride.fm', this)">🌆 Nightride FM (Synthwave)</button>
        <button class="station-btn" onclick="playStation('Chillout & Lounge', 'https://ilovemusic.de', this)">🌴 Chillout Lounge</button>
        <button class="station-btn" onclick="playStation('Top 100 Pop Hits', 'https://ilovemusic.de', this)">🔥 Top 100 Hits</button>
    </div>

    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">▶</button>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7" oninput="setVolume(this.value)">
    </div>

    <audio id="audioPlayer"></audio>
</div>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const stationLabel = document.getElementById('currentStation');
    let isPlaying = false;

    audio.volume = 0.7;

    function playStation(name, url, btnElement) {
        document.querySelectorAll('.station-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        stationLabel.textContent = "Загрузка: " + name + "...";
        audio.src = url;
        audio.play().then(() => {
            isPlaying = true;
            playBtn.textContent = "⏸";
            stationLabel.textContent = "В эфире: " + name;
        }).catch(() => {
            stationLabel.textContent = "Ошибка потока. Попробуйте другую волну.";
        });
    }

    function togglePlay() {
        if (!audio.src) return;
        if (isPlaying) {
            audio.pause();
            playBtn.textContent = "▶";
            isPlaying = false;
        } else {
            audio.play();
            playBtn.textContent = "⏸";
            isPlaying = true;
        }
    }

    function setVolume(val) {
        audio.volume = val;
    }
</script>

</body>
</html>
